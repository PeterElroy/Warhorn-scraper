name: Run Warhorn Scraper

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'The Warhorn URL you want to scrape'
        required: true
        default: 'https://warhorn.net...'
      additional_args:
        description: 'Optional arguments or flags (e.g., --output csv)'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      # 1. Fetch the repository files
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up a Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Cache dependencies to speed up future runs
      - name: Cache Pip Packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 4. Install requirements (assuming you have a requirements.txt file)
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 5. Execute the scraper with the user inputs
      - name: Run Scraper Script
        run: |
          python main.py "${{ github.event.inputs.target_url }}" ${{ github.event.inputs.target_url.additional_args }}
